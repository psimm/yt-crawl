[project]
name = "yt-crawl"
version = "0.1.0"
description = "Budget-safe SearchAPI crawler for auditable YouTube topic research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dateparser>=1.2.2",
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "inquirerpy>=0.3.4",
    "logfire>=4.39.0",
    "loguru>=0.7.3",
    "openai>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
yt-crawl = "yt_crawl.cli:app"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.71.0",
    "hatchling>=1.31.0",
    "pytest>=8.4.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_crawl"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/yt_crawl/models/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
